<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SiPESC.PRE · 结果模块参考</title>
    <style>
      :root {
        color-scheme: light;
        font:
          12px/1.4 "Microsoft YaHei",
          "PingFang SC",
          system-ui,
          sans-serif;
        color: #24364b;
        background: #e6ebf2;
        --line: #c7d1df;
        --blue: #285d9c;
        --selected: #e1ecfc;
        --muted: #576b82;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled,
      input:disabled,
      select:disabled {
        cursor: default;
        color: #68798c;
        background: #edf0f4;
        border-color: #d3dae3;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid #3471bf;
        outline-offset: 2px;
      }
      button,
      select,
      input[type="number"] {
        min-height: 26px;
        border: 1px solid #b7c5d6;
        border-radius: 2px;
        background: #fff;
      }
      select,
      input[type="number"] {
        min-width: 0;
        width: 100%;
        padding: 2px 4px;
      }
      input[type="checkbox"] {
        accent-color: #366aa8;
        margin: 0 4px 0 0;
        vertical-align: middle;
      }
      a {
        color: var(--blue);
      }
      button:hover:not(:disabled) {
        background: #edf4ff;
        border-color: #8aadd8;
      }
      button[aria-pressed="true"] {
        background: var(--selected);
        border-color: #73a0d7;
        color: #174a86;
      }
      button:disabled svg {
        opacity: 0.42;
      }
      svg.icon {
        width: 17px;
        height: 17px;
        flex: none;
        vertical-align: middle;
        color: #42668f;
      }
      button > svg.icon {
        pointer-events: none;
      }
      button.with-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 2px 5px;
        white-space: nowrap;
      }
      button.with-icon:not(.icon-only) > svg {
        margin-right: 1px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 42px;
        padding: 6px 13px;
        background: #f5f7fa;
        border-bottom: 1px solid var(--line);
      }
      header strong {
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      header .company {
        color: var(--muted);
      }
      header .page-title {
        padding-left: 12px;
        border-left: 1px solid #cbd3de;
      }
      header .actions {
        margin-left: auto;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      header button {
        padding-inline: 8px;
      }
      nav {
        display: flex;
        align-items: end;
        gap: 3px;
        padding: 4px 10px 0;
        background: #e1e7ef;
        border-bottom: 1px solid #8ba8d0;
        min-height: 34px;
      }
      nav span {
        padding: 5px 13px;
        color: #526274;
        white-space: nowrap;
      }
      nav span[aria-current] {
        color: var(--blue);
        font-weight: 650;
        background: #f7faff;
        border: 1px solid #95b3d9;
        border-bottom: 0;
        border-radius: 2px 2px 0 0;
      }
      .ribbon {
        display: flex;
        align-items: stretch;
        flex-wrap: wrap;
        background: #f9fafc;
        border-bottom: 1px solid var(--line);
      }
      .group {
        min-width: 0;
        flex: 1 0 var(--w);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .group:last-child {
        border-right: 0;
      }
      .controls {
        padding: 6px 5px;
        min-height: 101px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .caption {
        text-align: center;
        color: #526981;
        background: #eaf0f6;
        padding: 3px 3px;
        white-space: nowrap;
        margin-top: auto;
        border-top: 1px solid #e2e8ef;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 26px;
      }
      .row > span:first-child {
        white-space: nowrap;
      }
      .row > .grow {
        flex: 1;
        min-width: 0;
      }
      .row .compact {
        min-width: 0;
        flex: 1;
      }
      .toggle-row > button {
        width: 100%;
        justify-content: flex-start;
      }
      .center {
        justify-content: center;
      }
      .center .with-icon {
        width: 100%;
      }
      .four {
        display: grid;
        grid-template-columns: repeat(2, 29px);
        gap: 4px;
        justify-content: center;
        align-content: center;
        flex: 1;
      }
      .four button {
        height: 29px;
      }
      .play {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
      }
      .play button.with-icon {
        min-width: 0;
        padding: 2px;
      }
      .grow-column {
        justify-content: center;
        flex: 1;
      }
      .command-column {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .big-command {
        flex-direction: column;
        gap: 4px;
        white-space: normal !important;
        padding: 6px !important;
      }
      .big-command svg.icon {
        width: 27px;
        height: 27px;
      }
      .checks {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .checks label {
        white-space: nowrap;
      }
      .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        font-size: 11px;
      }
      .work {
        flex: 1;
        min-height: 400px;
        display: flex;
        flex-direction: column;
        padding: 8px 10px 10px;
        gap: 7px;
      }
      .subbar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 30px;
        color: var(--muted);
        padding: 0 2px;
      }
      .subbar strong {
        color: #24364b;
      }
      .subbar .hint {
        margin-left: auto;
        text-align: right;
      }
      .views {
        flex: 1;
        display: grid;
        gap: 6px;
        min-width: 0;
        grid-auto-rows: minmax(235px, 1fr);
      }
      .views[data-layout="side"],
      .views[data-layout="three"],
      .views[data-layout="four"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .views[data-layout="three"] .view:last-child {
        grid-column: 1/-1;
      }
      .view {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border: 1px solid #a9b8ca;
        background: #f6f9fd;
      }
      .view.active {
        border-color: #477dbf;
        box-shadow: 0 0 0 1px #477dbf inset;
      }
      .view-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 8px;
        background: #e7edf6;
        border-bottom: 1px solid #c3d0df;
        gap: 6px;
        color: var(--muted);
      }
      .view-title button {
        padding: 2px 5px;
        background: transparent;
        border-color: transparent;
        min-height: 22px;
      }
      .plot {
        flex: 1;
        position: relative;
        min-height: 200px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #fff 0, #eaf0f8 100%);
      }
      .plot.picking {
        cursor: crosshair;
      }
      .plot svg.mesh {
        width: min(88%, 680px);
        height: min(90%, 445px);
        pointer-events: none;
      }
      .axes {
        position: absolute;
        left: 12px;
        bottom: 8px;
        color: #536d8b;
        font-size: 11px;
        pointer-events: none;
      }
      .legend {
        position: absolute;
        right: 12px;
        top: 12px;
        display: grid;
        gap: 4px;
        justify-items: center;
        font-size: 10px;
        color: #38516d;
        pointer-events: none;
      }
      .legend i {
        height: 84px;
        width: 9px;
        background: linear-gradient(#df644a, #f4c45c, #80caa5, #377acf);
        border: 1px solid #97a8be;
      }
      .tag {
        position: absolute;
        transform: translate(-50%, -50%);
        background: #f4f8ff;
        border: 1px solid #7296c3;
        color: #224f86;
        font-size: 11px;
        white-space: nowrap;
        padding: 1px 5px;
        border-radius: 2px;
      }
      .tag.extremum {
        pointer-events: none;
      }
      .tag.max {
        color: #8b3e27;
        border-color: #c8a191;
      }
      .tag button {
        min-height: 0;
        padding: 0 2px;
        margin-left: 3px;
        background: transparent;
        border: 0;
      }
      .status {
        padding: 5px 12px;
        display: flex;
        gap: 10px;
        min-height: 29px;
        align-items: center;
        border-top: 1px solid var(--line);
        background: #f7f9fc;
        color: var(--muted);
      }
      #feedback {
        margin-left: auto;
        color: #365e8e;
        text-align: right;
      }
      dialog {
        max-width: min(900px, 94vw);
        max-height: 86dvh;
        border: 1px solid #a6b7ce;
        border-radius: 4px;
        padding: 0;
        background: #f9fbfe;
        color: inherit;
        box-shadow: 0 12px 40px #18335544;
      }
      dialog::backdrop {
        background: #1f324b50;
      }
      dialog header {
        position: sticky;
        top: 0;
        z-index: 1;
      }
      dialog header button {
        margin-left: auto;
      }
      .body {
        padding: 13px 16px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
        gap: 8px;
      }
      .card {
        border: 1px solid #d5dfeb;
        background: #fff;
        padding: 8px 10px;
      }
      .card strong {
        display: block;
        margin-bottom: 5px;
      }
      .samples {
        display: flex;
        justify-content: space-around;
        gap: 4px;
      }
      .samples div {
        text-align: center;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }
      .sample {
        display: grid;
        place-items: center;
        margin: 0 auto 3px;
        width: 33px;
        height: 29px;
        border: 1px solid transparent;
      }
      .sample svg.icon {
        width: 22px;
        height: 22px;
      }
      .sample.selected {
        border-color: #7fa7da;
        background: var(--selected);
      }
      .sample.disabled svg {
        opacity: 0.38;
      }
      .popup {
        position: absolute;
        z-index: 2;
        border: 1px solid var(--line);
        background: #fff;
        box-shadow: 0 8px 16px #24364b24;
        display: grid;
        gap: 3px;
        padding: 4px;
      }
      .popup[hidden] {
        display: none;
      }
      .popup button {
        min-width: 110px;
      }
      .probe-control {
        position: relative;
      }
      @media (max-width: 750px) {
        header {
          flex-wrap: wrap;
        }
        header .actions {
          margin-left: 0;
        }
        nav {
          overflow: auto;
        }
        nav span {
          padding-inline: 9px;
        }
        .subbar {
          flex-wrap: wrap;
        }
        .subbar .hint {
          margin-left: 0;
        }
        .legend {
          right: 6px;
        }
        .work {
          padding-inline: 5px;
        }
        .status {
          flex-wrap: wrap;
        }
        #feedback {
          margin-left: 0;
        }
        .plot svg.mesh {
          width: 86%;
        }
      }
    </style>
  </head>

    <header>
      <strong>SiPESC.PRE</strong><span class="company">星派科技</span
      ><span class="page-title">结果模块参考</span>
      <div class="actions">
        <button id="icons">图标与状态</button
        ><a id="back" href="/">返回工作台</a>
      </div>
    </header>
    <nav aria-label="模块位置参考">
      <span>部件</span><span>属性</span><span>装配</span><span>分析步</span
      ><span>相互作用</span><span>载荷</span><span>网格</span><span>求解</span
      ><span aria-current="page">结果</span>
    </nav>
    <section id="ribbon" class="ribbon" aria-label="结果功能区"></section>
    <main class="work">
      <div class="subbar">
        <strong>结果视图区</strong><span id="context"></span
        ><span class="hint">示意网格 · 色阶、变形和点位用于交互评审</span>
      </div>
      <div
        id="views"
        class="views"
        data-layout="single"
        aria-label="示例视图"
      ></div>
    </main>
    <footer class="status">
      <span>会话内演示</span><span id="summary"></span
      ><span id="feedback" role="status"></span>
    </footer>
    <dialog id="review" aria-labelledby="review-title">
      <header>
        <strong id="review-title">结果功能图标与控件状态</strong
        ><button type="button" class="close-dialog">关闭</button>
      </header>
      <div class="body"><div class="gallery" id="gallery"></div></div>
    </dialog>
    <dialog id="detail" aria-labelledby="detail-title">
      <header>
        <strong id="detail-title"></strong
        ><button type="button" class="close-dialog">关闭</button>
      </header>
      <p class="body" id="detail-body"></p>
    </dialog>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const icon = (name) =>
        `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const escapeHtml = (text) =>
        String(text).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const button = (id, label, image, options = {}) => {
        const { toggle = false, only = false, className = "" } = options;

      function surface(view) {

              fields[state.field][1].indexOf(state.component) * 2 +

            const high = state.rangeMode === "manual" ? state.max : 100;
            const band = Math.round(

        } else if (state.plane === "YZ") {

          clipRect = `<polygon points="${state.flipped ? `${cutPosition + 72},0 620,0 620,360 ${cutPosition - 72},360` : `0,0 ${cutPosition + 72},0 ${cutPosition - 72},360 0,360`}"/>`;

      });
      onClick("prev", () => {
        stopTimer();
        changeFrame(state.frame - 1);
      });
      onClick("next", () => {
        stopTimer();
        changeFrame(state.frame + 1);
      });
      onClick("play", () => {
        if (state.timer !== null) {
          stopTimer();
          return;
        }
        if (state.harmonic) {
          state.timer = setInterval(() => {
            state.phase = (state.phase + 12) % 360;
            update();
          }, 85);
        } else {
          if (state.frame === frameList().length - 1) changeFrame(0);
          state.timer = setInterval(() => {
            changeFrame(state.frame + 1);
            if (state.frame === frameList().length - 1) {
              stopTimer();
              update();
            }
          }, 620);
        }
      });
      onClick("stop", () => {
        stopTimer();
        if (state.harmonic || state.file === "modal") state.phase = 0;
        else changeFrame(0);
      });
      onClick("probe", () => {
        state.probe = !state.probe;
        notify(
          state.probe ? "点击视图区添加探针，按 Esc 退出。" : "已退出探针。",
        );
      });
      for (const [id] of layouts)
        onClick(id, () => {
          if (state.layout !== id) {
            state.layout = id;
            state.active = Math.min(state.active, viewCount() - 1);
            drawViews(true);
          }
        });
      function closeClear(restore = false) {
        $("clear-options").hidden = true;
        $("clear").setAttribute("aria-expanded", "false");
        if (restore) $("clear").focus();
      }
      $("clear").addEventListener("click", () => {
        if (!$("clear-options").hidden) {
          closeClear();
          return;
        }
        $("clear-options").hidden = false;
        $("clear").setAttribute("aria-expanded", "true");
        ($("clear-active").disabled
          ? $("clear-all")
          : $("clear-active")
        ).focus();
      });
      onClick("clear-active", () => {
        state.markers[state.active] = [];
        closeClear(true);
      });
      onClick("clear-all", () => {
        state.markers = [[], [], [], []];
        closeClear(true);
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".probe-control")) closeClear();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || document.querySelector("dialog[open]"))
          return;
        if (!$("clear-options").hidden) {
          closeClear(true);
          return;
        }
        if (state.probe) {
          state.probe = false;
          notify("已退出探针。");
          update();
        }
      });
      function addMarker(view, x, y) {
        state.active = view;
        state.markers[view].push({ id: state.nextProbe++, x, y });
      }
      $("views").addEventListener("click", (event) => {
        const pane = event.target.closest("[data-view]");
        if (!pane) return;
        const view = Number(pane.dataset.view);
        const removal = event.target.closest("[data-remove]");
        const plot = event.target.closest("[data-plot]");
        if (removal) {
          state.markers[view] = state.markers[view].filter(
            (marker) => marker.id !== Number(removal.dataset.remove),
          );
          plot.focus();
        } else if (plot && state.probe) {
          const rect = plot.getBoundingClientRect();
          const x = Math.min(
            94,
            Math.max(6, ((event.clientX - rect.left) / rect.width) * 100),
          );
          const y = Math.min(
            92,
            Math.max(8, ((event.clientY - rect.top) / rect.height) * 100),
          );
          addMarker(view, x, y);
        }
        state.active = view;
        update();
      });
      $("views").addEventListener("keydown", (event) => {
        if (
          event.target.matches("[data-plot]") &&
          state.probe &&
          ["Enter", " "].includes(event.key)
        ) {
          event.preventDefault();
          addMarker(Number(event.target.dataset.plot), 50, 50);
          update();
        }
      });
      const reviewIcons = [
        ["常规线性", "linear", true],
        ["简谐", "wave", true],
        ["云图", "cloud", true],
        ["变形", "deform", true],
        ["剖切", "cut", true],
        ["图例", "legend", true],
        ["上一帧 / 阶", "prev"],
        ["播放", "play"],
        ["暂停", "pause"],
        ["下一帧 / 阶", "next"],
        ["停止", "stop"],
        ["结果探针", "probe", true],
        ["清除探针", "clear"],
        ["极大值", "max", true],
        ["极小值", "min", true],
        ["导出", "export"],
        ["报告", "report"],
        ["自定义运算", "calc"],
        ...layouts.map(([id, label]) => [label, id, true]),
      ];
      $("icons").addEventListener("click", () => {
        $("gallery").innerHTML = reviewIcons
          .map(([label, name, selected]) => {
            const samples = [
              ["", "默认"],
              ["disabled", "禁用"],
            ];
            if (selected) samples.splice(1, 0, ["selected", "选中"]);
            return `<div class="card"><strong>${label}</strong><div class="samples">${samples.map(([style, text]) => `<div><span class="sample ${style}">${icon(name)}</span>${text}</div>`).join("")}</div></div>`;
          })
          .join("");
        $("review").showModal();
      });
      for (const [id, label, description] of [
        ["export", "导出", "导出格式与包含的结果字段待确认。"],
        ["report", "报告", "报告模板与数据范围待确认。"],
        ["calc", "自定义运算", "表达式语法、输入变量和校验规则待确认。"],
      ]) {
        $(id).addEventListener("click", () => {
          $("detail-title").textContent = label;
          $("detail-body").textContent = description;
          $("detail").showModal();
        });
      }
      for (const close of document.querySelectorAll(".close-dialog"))
        close.addEventListener("click", () => close.closest("dialog").close());
      $("back").hidden =
        !location.pathname.endsWith("/reference/results-reference.html") ||
        location.protocol === "file:";
      window.addEventListener("pagehide", stopTimer);
      update();
    </script>
  </body>
</html>
